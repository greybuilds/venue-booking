{% extends "base.html" %}

{% block title %}Add Blocked Date | Roomly{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 700px;">

    <h1 class="mb-2">Add Blocked Date</h1>
    <p class="text-muted mb-4">
        Block a specific venue or all venues for a selected period.
    </p>

    <form method="post" class="vb-card p-4">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-accent">
            Save Blocked Date
        </button>

        <a href="{% url 'venue_list' %}" class="btn btn-outline-secondary">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
