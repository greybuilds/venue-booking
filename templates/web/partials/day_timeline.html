    <div class="tl" data-day="{{ day|date:'Y-m-d' }}" data-open="{{ venue.opens_at|time:'H:i' }}" data-close="{{ venue.closes_at|time:'H:i' }}">
      <div class="timeline">
        <div class="tl__lane">
          {% for h in hours %}<div class="tick" style="--l:{{ h.left }}"></div>{% endfor %}
          {% for bar in bars %}
            <div class="slot {{ bar.b.status|lower }}" style="--l:{{ bar.left }};--w:{{ bar.width }};--i:{{ forloop.counter0 }}" data-l="{{ bar.left }}" data-w="{{ bar.width }}" title="{{ bar.b.society }} {{ bar.b.start|time:'H:i' }}-{{ bar.b.end|time:'H:i' }}">{{ bar.b.society }}</div>
          {% endfor %}
          <span class="tl__now" hidden></span>
        </div>
      </div>
      <div class="tick-labels"><div class="tl__lane">{% for h in hours %}<span style="--l:{{ h.left }}">{{ h.label }}</span>{% endfor %}</div></div>
    </div>
    <p class="legend"><span><i></i>Confirmed</span><span><i class="wait"></i>Waiting for approval</span><span><i class="free"></i>Free</span></p>
