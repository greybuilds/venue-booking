<li class="mb-row{% if past %} is-past{% endif %}">
  <span class="mb-row__date"><b>{{ b.start|date:"j" }}</b><small>{{ b.start|date:"M" }}</small></span>
  <span class="mb-row__txt">
    <a class="mb-row__venue stretched-link" href="{% url 'booking_detail' b.pk %}" hx-get="{% url 'booking_detail' b.pk %}" hx-target="#sheet-body" hx-swap="innerHTML" hx-push-url="false">{{ b.venue.name }}</a>
    <span class="mb-row__meta">{{ b.society }} &middot; {{ b.start|date:"D" }} {{ b.start|time:"H:i" }}&ndash;{{ b.end|time:"H:i" }}</span>
  </span>
  {% include "web/partials/status.html" %}
  <span class="roundbtn mb-row__go" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 3.5 13 8l-4 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</li>
